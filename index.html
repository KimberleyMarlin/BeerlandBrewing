<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Beerland Brewing — Age check</title>
<script>
try{if(localStorage.getItem('bl_age')){location.replace('home.html')}}catch(e){}
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href="home.html"]');if(!a)return;var r=document.querySelector('input[type=checkbox]');try{((r&&r.checked)?localStorage:sessionStorage).setItem('bl_age','1')}catch(_){}} ,true);
</script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&amp;family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@400;500;600&amp;family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0;background:#17130F}
a{color:#F1E6D0;text-decoration:none}a:hover{color:#D99A3E}
.grain{background-color:#17130F;background-image:url("assets/daf2435bb63e0683550d26f14d0f41dd.png");background-size:480px 480px}
.vid{background-color:#2A2119;background-image:repeating-linear-gradient(135deg, rgba(241,230,208,.045) 0 14px, transparent 14px 28px)}
:focus-visible{outline:3px solid #D99A3E;outline-offset:3px}
.btn-solid:hover{background:#F1E6D0 !important;color:#17130F !important}
.btn-line:hover{border-color:#F1E6D0 !important}
</style>

</head>
<body>
<div id="app"></div>
<template id="dc-template">
<div class="grain" style="position: relative; min-height: 900px; font-family: 'Barlow', system-ui, sans-serif; color: #F1E6D0; overflow: hidden">

  <div aria-hidden="true" style="position: absolute; inset: 0; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 24px clamp(16px, 4vw, 56px); gap: 24px">
      <img src="assets/6f21b57650c7a9529a6a3dec3bba04b6.svg" alt="" style="display: block; width: 116px; height: auto">
      <div style="display: flex; gap: 28px; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; font-size: 15px">
        <span>Our Beers</span><span>Where to Buy</span><span>Merch</span>
      </div>
    </div>
    <div class="vid" style="flex: 1; display: flex; align-items: center; justify-content: center">
      <img src="assets/6f21b57650c7a9529a6a3dec3bba04b6.svg" alt="" style="display: block; width: min(60vw, 640px); height: auto; opacity: .2">
    </div>
  </div>

  <div style="position: relative; min-height: 900px; background: rgba(10, 8, 6, .8); display: flex; align-items: center; justify-content: center; padding: 32px 16px; box-sizing: border-box">
    <div role="dialog" aria-modal="true" aria-labelledby="agegate-title" style="width: 100%; max-width: 560px; background: #17130F; border: 2px solid #D99A3E; outline: 1px solid rgba(217, 154, 62, .45); outline-offset: 6px; padding: 48px clamp(20px, 5vw, 48px) 36px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center">

      <img src="assets/ba7dee7fce34d01e26c07af851e3b856.svg" alt="Beerland Brewing" style="display: block; width: 190px; max-width: 60%; height: auto">

      <div aria-hidden="true" style="display: flex; align-items: center; gap: 12px; width: 220px">
        <div style="flex: 1; height: 1px; background: #D99A3E"></div>
        <div style="width: 8px; height: 8px; background: #D99A3E; transform: rotate(45deg)"></div>
        <div style="flex: 1; height: 1px; background: #D99A3E"></div>
      </div>

      <sc-if value="{{ allowed }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%">
          <div style="font-family: 'Archivo', 'Barlow', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 15px; letter-spacing: 3px; text-transform: uppercase; color: #D99A3E; line-height: 1.2">Before you come in…</div>
          <h1 id="agegate-title" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 40px; line-height: 1.05; text-transform: uppercase; letter-spacing: 1px">Are you 18 or over?</h1>
          <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #CDBFA6; max-width: 380px">You must be of legal drinking age in Australia to enter this site.</p>
          <div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; width: 100%">
            <a href="home.html" class="btn-solid" style="display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 32px; background: #D99A3E; color: #17130F; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; flex: 1 1 180px">Yes, I'm 18+</a>
            <button type="button" onClick="{{ deny }}" class="btn-line" style="min-height: 52px; padding: 0 32px; background: transparent; color: #F1E6D0; border: 2px solid rgba(241, 230, 208, .4); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; flex: 1 1 180px">No</button>
          </div>
          <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #CDBFA6; cursor: pointer; min-height: 44px">
            <input type="checkbox" style="width: 18px; height: 18px; accent-color: #D99A3E; margin: 0">
            <span>Remember me on this device</span>
          </label>
        </div>
      </sc-if>

      <sc-if value="{{ denied }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 16px">
          <div style="font-family: 'Archivo', 'Barlow', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 15px; letter-spacing: 3px; text-transform: uppercase; color: #D99A3E; line-height: 1.2">Sorry, mate</div>
          <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 36px; line-height: 1.05; text-transform: uppercase; letter-spacing: 1px">Come back when you're 18</h1>
          <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #CDBFA6; max-width: 380px">You need to be of legal drinking age to visit the Beerland Brewing website.</p>
          <button type="button" onClick="{{ reset }}" style="min-height: 44px; padding: 0 16px; background: transparent; border: 0; color: #D99A3E; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 2px; text-transform: uppercase; text-decoration: underline; cursor: pointer">I clicked the wrong button</button>
        </div>
      </sc-if>

      <p style="margin: 8px 0 0; font-size: 12px; line-height: 1.5; color: #A99A80">Enjoy responsibly. It is an offence to sell or supply liquor to a person under the age of 18 years.</p>
    </div>
  </div>
</div>
</template>
<script type="text/x-dc" id="dc-logic" data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const denied = !!(this.state && this.state.denied);
    return {
      denied: denied,
      allowed: !denied,
      deny: () => this.setState({ denied: true }),
      reset: () => this.setState({ denied: false })
    };
  }
}
</script>
<script src="preact.min.js"></script>
<script src="dc-lite.js"></script>
</body>
</html>
