<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Beerland Brewing — Home</title>
<script>try{if(!localStorage.getItem('bl_age')&&!sessionStorage.getItem('bl_age')){location.replace('index.html')}}catch(e){}</script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&amp;family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@400;500;600&amp;family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0;background:#17130F}
a{color:#F1E6D0;text-decoration:none}a:hover{color:#D99A3E}
.grain{background-color:#17130F;background-image:url("assets/daf2435bb63e0683550d26f14d0f41dd.png");background-size:480px 480px}
.vid{background-color:#2A2119;background-image:repeating-linear-gradient(135deg, rgba(241,230,208,.045) 0 14px, transparent 14px 28px)}
:focus-visible{outline:3px solid #D99A3E;outline-offset:3px}
.btn-solid:hover{background:#F1E6D0 !important;color:#17130F !important}
.btn-line:hover{border-color:#F1E6D0 !important;color:#F1E6D0 !important}
@media (max-width: 900px){.slide-text{min-height:800px;box-sizing:border-box}}
.btn-dark:hover{background:#D99A3E !important;color:#17130F !important}
.tile:hover .tile-cta{color:#D99A3E !important}
input::placeholder{color:#7A6E5C}
.hero-badge{display:block}
@media (max-width: 960px){.hero-badge{display:none}}
.ig-tile:hover .ig-ov,.ig-tile:focus-visible .ig-ov{opacity:1 !important}
</style>

</head>
<body>
<div id="app"></div>
<template id="dc-template">
<div class="grain" style="font-family: 'Barlow', system-ui, sans-serif; color: #F1E6D0; min-height: 900px">

  <!-- HERO: video header -->
  <header class="vid" style="position: relative; min-height: 820px; display: flex; flex-direction: column; overflow: hidden">
    <video ref="{{ videoRef }}" autoplay="autoplay" muted="muted" loop="loop" playsinline="playsinline" preload="auto" poster="assets/f1f559c1cfccbc2c6d791622d3a5e3ba.jpg" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block">
      <source src="assets/22d9044ed0e91ff4572590be94c8f0d9.mp4" type="video/mp4" media="(max-aspect-ratio: 3/4)">
      <source src="assets/6865d0eb5101c021ba37b94c5b8ce7cc.mp4" type="video/mp4">
    </video>
    <div style="position: absolute; inset: 0; background: rgba(15, 12, 9, .5)"></div>
    <button type="button" onClick="{{ togglePlay }}" aria-label="{{ playLabel }}" style="position: absolute; z-index: 2; right: clamp(16px, 4vw, 56px); bottom: 24px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: rgba(23, 19, 15, .6); color: #F1E6D0; border: 1px solid rgba(241, 230, 208, .5); cursor: pointer">
      <sc-if value="{{ isPlaying }}" hint-placeholder-val="{{ true }}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><line x1="8" y1="5" x2="8" y2="19"></line><line x1="16" y1="5" x2="16" y2="19"></line></svg>
      </sc-if>
      <sc-if value="{{ isPaused }}" hint-placeholder-val="{{ false }}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><polygon points="7 4 20 12 7 20"></polygon></svg>
      </sc-if>
    </button>

    <nav aria-label="Main" style="position: relative; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 32px; padding: 20px clamp(16px, 4vw, 56px); border-bottom: 1px solid rgba(241, 230, 208, .15)">
      <a href="home.html" style="display: flex; align-items: center; padding: 4px 0">
        <img src="assets/6f21b57650c7a9529a6a3dec3bba04b6.svg" alt="Beerland Brewing" style="display: block; width: 116px; height: auto">
      </a>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 28px; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 2px; text-transform: uppercase">
        <a href="our-beers.html" style="padding: 12px 0">Our Beers</a>
        <a href="where-to-buy.html" style="padding: 12px 0">Where to Buy</a>
        <a href="merch.html" style="padding: 12px 0">Merch</a>
        <a href="#signup" class="btn-line" style="padding: 10px 18px; border: 2px solid {{accent}}; color: {{accent}}">Join the list</a>
      </div>
    </nav>

    <img src="assets/ba7dee7fce34d01e26c07af851e3b856.svg" alt="" aria-hidden="true" class="hero-badge" style="position: absolute; right: clamp(40px, 6vw, 110px); top: 50%; transform: translateY(-38%); width: clamp(220px, 24vw, 340px); height: auto; filter: drop-shadow(0 8px 24px rgba(0, 0, 0, .45))">
    <div style="position: relative; flex: 1; display: flex; align-items: flex-end; padding: 80px clamp(16px, 4vw, 56px) 96px">
      <div style="max-width: 900px; display: flex; flex-direction: column; gap: 20px">
        <div style="font-family: 'Archivo', 'Barlow', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 17px; letter-spacing: 3px; text-transform: uppercase; color: {{accent}}; line-height: 1.2">Fresh from the tanks</div>
        <h1 style="margin: 0; font-family: 'Alfa Slab One', Georgia, serif; font-weight: 400; font-size: clamp(56px, 9vw, 132px); line-height: .92; letter-spacing: 1px; text-transform: uppercase">New beers.<br>Online now.</h1>
        <p style="margin: 0; font-size: 20px; line-height: 1.5; color: #E2D6BF; max-width: 560px">Small-batch beer from Beerland Brewing, brewed at Whitfords Brewing Co.</p>
        <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px">
          <a href="#new-beers" class="btn-solid" style="display: inline-flex; align-items: center; min-height: 54px; padding: 0 30px; background: {{accent}}; color: #17130F; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 2px; text-transform: uppercase">See the new beers</a>
          <a href="where-to-buy.html" class="btn-line" style="display: inline-flex; align-items: center; min-height: 54px; padding: 0 30px; border: 2px solid rgba(241, 230, 208, .5); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 2px; text-transform: uppercase">Where to buy</a>
        </div>
      </div>
    </div>
  </header>

  <!-- NEXT DROP countdown -->
  <section aria-label="Next release" style="background: {{accent}}; color: #17130F; padding: 22px clamp(16px, 4vw, 56px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 40px">
    <div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 3px; text-transform: uppercase">Next drop:</span>
      <span style="font-family: 'Alfa Slab One', Georgia, serif; font-size: 28px; text-transform: uppercase">Jurassic Fog &amp; Guava Lava</span>
    </div>
    <sc-if value="{{ live }}" hint-placeholder-val="{{ false }}">
      <span style="font-family: 'Alfa Slab One', Georgia, serif; font-size: 32px; text-transform: uppercase">Online now!</span>
    </sc-if>
    <sc-if value="{{ counting }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; gap: 10px" aria-live="off">
        <sc-for list="{{ units }}" as="u" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; align-items: center; min-width: 72px; padding: 8px 10px; background: #17130F; color: #F1E6D0">
            <span style="font-family: 'Alfa Slab One', Georgia, serif; font-size: 30px; line-height: 1.1">{{ u.value }}</span>
            <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #CDBFA6">{{ u.label }}</span>
          </div>
        </sc-for>
      </div>
    </sc-if>
  </section>

  <!-- NEW BEERS -->
  <section id="new-beers" aria-roledescription="carousel" aria-label="New releases" style="padding: 80px clamp(16px, 4vw, 56px); max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-family: 'Archivo', 'Barlow', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 15px; letter-spacing: 3px; text-transform: uppercase; color: {{accent}}; line-height: 1.2">Small batch · Limited edition</div>
        <h2 style="margin: 0; font-family: 'Alfa Slab One', Georgia, serif; font-weight: 400; font-size: clamp(40px, 5vw, 64px); line-height: 1; text-transform: uppercase">Limited Releases</h2>
      </div>
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 17px; letter-spacing: 2px; color: #CDBFA6; min-width: 64px; text-align: right">{{ counter }}</span>
        <button type="button" onClick="{{ prev }}" aria-label="Previous beer" class="btn-line" style="width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; background: transparent; color: #F1E6D0; border: 2px solid rgba(241, 230, 208, .4); cursor: pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><polyline points="15 5 8 12 15 19"></polyline></svg>
        </button>
        <button type="button" onClick="{{ next }}" aria-label="Next beer" class="btn-solid" style="width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; background: {{accent}}; color: #17130F; border: 0; cursor: pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><polyline points="9 5 16 12 9 19"></polyline></svg>
        </button>
      </div>
    </div>

    <article aria-roledescription="slide" aria-label="{{ counter }}" style="display: flex; flex-wrap: wrap; min-height: 580px; background: #221C16; border: 1px solid rgba(241, 230, 208, .12)">
      <div style="flex: 1 1 380px; position: relative; min-height: 460px; display: flex; align-items: center; justify-content: center; padding: 40px 24px; box-sizing: border-box; background: {{ beer.bg }}">
        <img src="{{ beer.img }}" alt="{{ beer.alt }}" style="display: block; height: 400px; max-width: 100%; object-fit: contain; border-radius: 6px; box-shadow: 0 24px 48px rgba(0, 0, 0, .45)">
      </div>
      <div class="slide-text" style="flex: 1.3 1 460px; padding: 44px clamp(24px, 4vw, 56px); display: flex; flex-direction: column; justify-content: center; gap: 14px">
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <span style="padding: 6px 12px; background: {{accent}}; color: #17130F; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 2px; text-transform: uppercase">{{ beer.tag }}</span>
          <span style="padding: 5px 12px; border: 1px solid rgba(241, 230, 208, .4); font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: #E2D6BF">Ltd edition</span>
        </div>
        <h3 style="margin: 0; font-family: 'Alfa Slab One', Georgia, serif; font-weight: 400; font-size: clamp(36px, 4vw, 54px); line-height: 1; text-transform: uppercase">{{ beer.name }}</h3>
        <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; color: {{accent}}">{{ beer.style }}</div>
        <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #CDBFA6">{{ beer.notes1 }}</p>
        <sc-if value="{{ expanded }}" hint-placeholder-val="{{ false }}">
          <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #CDBFA6">{{ beer.notes2 }}</p>
        </sc-if>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 12px 24px; padding: 14px 0; border-top: 1px solid rgba(241, 230, 208, .15); border-bottom: 1px solid rgba(241, 230, 208, .15)">
          <sc-for list="{{ beer.specs }}" as="s" hint-placeholder-count="2">
            <div style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: #A99A80">{{ s.label }}</span>
              <span style="font-size: 16px">{{ s.value }}</span>
            </div>
          </sc-for>
        </div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin-top: 4px">
          <a href="where-to-buy.html" class="btn-solid" style="display: inline-flex; align-items: center; min-height: 52px; padding: 0 28px; background: {{accent}}; color: #17130F; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 2px; text-transform: uppercase">Where to buy</a>
          <button type="button" onClick="{{ toggleMore }}" aria-expanded="{{ expandedAttr }}" style="min-height: 44px; padding: 0; background: transparent; border: 0; border-bottom: 2px solid {{accent}}; color: #F1E6D0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer">{{ moreLabel }}</button>
        </div>
      </div>
    </article>

    <div role="group" aria-label="Choose a beer" style="display: flex; justify-content: center; gap: 4px">
      <sc-for list="{{ dots }}" as="d" hint-placeholder-count="3">
        <button type="button" onClick="{{ d.pick }}" aria-label="{{ d.label }}" aria-pressed="{{ d.pressed }}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; cursor: pointer; padding: 0">
          <span style="{{ d.bar }}"></span>
        </button>
      </sc-for>
    </div>
    <a href="our-beers.html" style="align-self: center; display: inline-flex; align-items: center; min-height: 44px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 2px; text-transform: uppercase; border-bottom: 2px solid {{accent}}">See all our beers →</a>
  </section>

  <!-- TILES: where to buy / merch -->
  <section aria-label="Explore" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(480px, 100%), 1fr)); gap: 0">
    <a href="where-to-buy.html" class="tile vid" style="position: relative; min-height: 420px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding: 48px clamp(16px, 4vw, 56px); border-right: 1px solid rgba(241, 230, 208, .1)">
      <span style="position: absolute; top: 24px; left: clamp(16px, 4vw, 56px); font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #A99A80">[Photo: beer in a venue]</span>
      <span style="font-family: 'Archivo', 'Barlow', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 15px; letter-spacing: 3px; text-transform: uppercase; color: {{accent}}; line-height: 1.2">Thirsty?</span>
      <span style="font-family: 'Alfa Slab One', Georgia, serif; font-size: clamp(40px, 5vw, 60px); line-height: 1; text-transform: uppercase">Where to buy</span>
      <span class="tile-cta" style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 2px; text-transform: uppercase">Find a stockist →</span>
    </a>
    <a href="merch.html" class="tile vid" style="position: relative; min-height: 420px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding: 48px clamp(16px, 4vw, 56px)">
      <span style="position: absolute; top: 24px; left: clamp(16px, 4vw, 56px); font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #A99A80">[Photo: merch flat-lay]</span>
      <span style="font-family: 'Archivo', 'Barlow', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 15px; letter-spacing: 3px; text-transform: uppercase; color: {{accent}}; line-height: 1.2">Rep the brand</span>
      <span style="font-family: 'Alfa Slab One', Georgia, serif; font-size: clamp(40px, 5vw, 60px); line-height: 1; text-transform: uppercase">Merch</span>
      <span class="tile-cta" style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 2px; text-transform: uppercase">Shop merch →</span>
    </a>
  </section>

  <!-- STORY -->
  <section style="padding: 112px clamp(16px, 4vw, 56px); max-width: 1100px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 48px 72px">
    <div style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 14px; margin: 0 auto">
      <span style="font-family: 'Archivo', 'Barlow', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: {{accent}}">Brewed at</span>
      <img src="assets/ef4963ebf9cabac20be71a805a4aa73e.png" alt="Whitfords Brewing Co." style="display: block; width: 160px; height: auto">
    </div>
    <div style="flex: 1 1 420px; display: flex; flex-direction: column; gap: 16px">
      <div style="font-family: 'Archivo', 'Barlow', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 15px; letter-spacing: 3px; text-transform: uppercase; color: {{accent}}; line-height: 1.2">Hand crafted in WA</div>
      <h2 style="margin: 0; font-family: 'Alfa Slab One', Georgia, serif; font-weight: 400; font-size: clamp(36px, 4.5vw, 52px); line-height: 1.05; text-transform: uppercase">Welcome to Beerland</h2>
      <p style="margin: 0; font-size: 18px; line-height: 1.6; color: #CDBFA6">Every Beerland beer is brewed onsite in our 12HL brewhouse at Whitfords Brewing Co., under the careful eye of Head Brewer Ken Arrowsmith — the original face of Emu Bitter. Our beers have won awards around Australia, including two Champion Australian Beer titles at the Australian International Beer Awards.</p>
      <a href="our-beers.html" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 2px; text-transform: uppercase; border-bottom: 2px solid {{accent}}">Meet the core range →</a>
    </div>
  </section>

  <!-- INSTAGRAM -->
  <section style="padding: 0 clamp(16px, 4vw, 56px) 112px; max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-family: 'Archivo', 'Barlow', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 15px; letter-spacing: 3px; text-transform: uppercase; color: {{accent}}; line-height: 1.2">Tag us on Instagram</div>
        <h2 style="margin: 0; font-family: 'Alfa Slab One', Georgia, serif; font-weight: 400; font-size: clamp(32px, 4vw, 44px); line-height: 1; text-transform: uppercase">{{ igTag }}</h2>
      </div>
      <div role="group" aria-label="Choose a hashtag" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{ igTabs }}" as="t" hint-placeholder-count="2">
          <button type="button" onClick="{{ t.pick }}" aria-pressed="{{ t.pressed }}" style="{{ t.style }}">{{ t.label }}</button>
        </sc-for>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(170px, 100%), 1fr)); gap: 10px">
      <sc-for list="{{ igPosts }}" as="p" hint-placeholder-count="6">
        <a href="{{ igLink }}" class="ig-tile" aria-label="{{ p.label }}" style="position: relative; display: block; aspect-ratio: 1; overflow: hidden; background: #221C16">
          <img src="{{ p.src }}" alt="" style="display: block; width: 100%; height: 100%; object-fit: cover">
          <span class="ig-ov" aria-hidden="true" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(23, 19, 15, .55); color: #F1E6D0; opacity: 0; transition: opacity .2s">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1"></circle></svg>
          </span>
        </a>
      </sc-for>
    </div>
    <a href="{{ igLink }}" style="align-self: center; display: inline-flex; align-items: center; gap: 10px; min-height: 44px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 2px; text-transform: uppercase; border-bottom: 2px solid {{accent}}">See more {{ igTag }} on Instagram →</a>
  </section>

  <!-- MAILING LIST -->
  <section id="signup" style="background: #F1E6D0; color: #17130F; padding: 96px clamp(16px, 4vw, 56px)">
    <div style="max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
      <div style="font-family: 'Archivo', 'Barlow', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 15px; letter-spacing: 3px; text-transform: uppercase; color: #8A3F24; line-height: 1.2">Be first in line</div>
      <h2 style="margin: 0; font-family: 'Alfa Slab One', Georgia, serif; font-weight: 400; font-size: clamp(38px, 5vw, 60px); line-height: 1; text-transform: uppercase">Join the mailing list</h2>
      <p style="margin: 0; font-size: 18px; line-height: 1.55; color: #4A3F33; max-width: 560px">New beer drops, merch restocks and events, straight to your inbox. No spam.</p>

      <sc-if value="{{ notJoined }}" hint-placeholder-val="{{ true }}">
        <form onSubmit="{{ join }}" style="width: 100%; display: flex; flex-direction: column; gap: 14px; margin-top: 16px; text-align: left">
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 12px">
            <label style="display: flex; flex-direction: column; gap: 6px; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 2px; text-transform: uppercase">
              <span>First name</span>
              <input type="text" name="firstName" autocomplete="given-name" placeholder="Your first name" style="min-height: 52px; padding: 0 16px; border: 2px solid #17130F; background: #FBF6EC; font-family: 'Barlow', sans-serif; font-size: 17px; color: #17130F; box-sizing: border-box">
            </label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 2px; text-transform: uppercase">
              <span>Email</span>
