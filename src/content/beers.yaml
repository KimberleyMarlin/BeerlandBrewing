# Our beers. `range: core` beers appear in the Core Range grid; `range: limited`
# beers appear in the Limited Releases carousel (in this order).
# To add a label image, drop the file in src/assets/beers/ and add an `image:` line.

- id: pineapple-padrino
  name: Pineapple Padrino
  range: limited
  style: Session IPA
  abv: 4.2
  tag: Face Off · Now pouring at WBC
  colour: '#C9622F'
  faceOff: true
  image: ../assets/beers/pineapple-padrino.jpg
  alt: 'Pineapple Padrino can label: a cigar-smoking pineapple in a tropical shirt among palm trees'
  summary: Don Pineapple rules the shipping docks with a smooth, sweet, fast-talking operation. He keeps his circle tight and his liquid gold moving fast.
  notes:
    - Built on Rahr Pale Malt and heavy flaked oats, aggressively dry-hopped with Citra and Vic Secret and injected with Pineapple Express terpenes. Expect a wave of fresh-cut pineapple chunks that finishes in a heavy cloud of sticky, tropical skunk.
  specs:
    - { label: Malt, value: 'Rahr Pale Malt, flaked oats' }
    - { label: Hops, value: 'Citra, Vic Secret' }
    - { label: Terpenes, value: Pineapple Express }

- id: grapefruit-godfather
  name: Grapefruit Godfather
  range: limited
  style: Session IPA
  abv: 4.2
  tag: Face Off · Now pouring at WBC
  colour: '#25467F'
  faceOff: true
  image: ../assets/beers/grapefruit-godfather.jpg
  alt: 'Grapefruit Godfather can label: a grapefruit-headed mob boss in a pinstripe suit against a city skyline'
  summary: The Grapefruit Godfather doesn't do sweet talk. Hardened by the gritty city asphalt, he runs the underground with a sharp wit and a bitter bite.
  notes:
    - Same smooth Rahr and oat canvas as his rival, but his operation takes a dark, resinous turn — dry-hopped with Cascade, Strata and Simcoe and loaded with Grapefruit Kush terpenes. A sharp, tart blast of pink grapefruit rind, backed by a deep, peppery, earthy resin finish.
  specs:
    - { label: Malt, value: 'Rahr Pale Malt, flaked oats' }
    - { label: Hops, value: 'Cascade, Strata, Simcoe' }
    - { label: Terpenes, value: Grapefruit Kush }

- id: guava-lava
  name: Guava Lava
  range: limited
  style: NEIPA
  abv: 5.8
  tag: Beerfest exclusive · from 13 Nov
  colour: '#5E9E57'
  image: ../assets/beers/guava-lava.jpg
  alt: 'Guava Lava can label: a pink volcano erupting over a rainforest'
  summary: Intense tropical fruit and candy-like hop character. Fermented warm with White Labs Suava and dry hopped mid-fermentation with Superdelic for layers of ripe mango, pink guava and berry candy — with white-wine and passionfruit esters and a soft, pillowy mouthfeel.
  notes:
    - A cool, terminal dry hop of Cryo Riwaka and Galaxy adds bright passionfruit, fresh peach and zesty pink grapefruit. The result is a clean, intensely juicy and highly aromatic hazy ale with impressive depth and minimal hop burn.
  specs:
    - { label: Yeast, value: White Labs Suava }
    - { label: Hops, value: 'Superdelic, Cryo Riwaka, Galaxy' }

- id: jurassic-fog
  name: Jurassic Fog
  range: limited
  style: NEIPA
  abv: 5.8
  tag: Beerfest exclusive · from 13 Nov
  colour: '#B8432F'
  image: ../assets/beers/jurassic-fog.jpg
  alt: 'Jurassic Fog can label: dinosaurs silhouetted against an orange sky and jungle'
  summary: A vibrant, pillowy juice bomb blending tropical sweetness with bright citrus. Fermented with London Fog yeast, it pours hazy and full-bodied with a velvety finish, and a Citra dry hop during active fermentation unlocks deep layers of mango and passionfruit.
  notes:
    - A terminal dry hop of El Dorado and Vic Secret adds punchy top notes of sweet pineapple, watermelon candy and a crisp hint of resinous pine. Candy-like fruit sweetness that stays clean and refreshing — an incredibly drinkable, modern NEIPA.
  specs:
    - { label: Yeast, value: London Fog }
    - { label: Hops, value: 'Citra, El Dorado, Vic Secret' }

# ---- Core range

- id: pale-ale
  name: Pale Ale
  range: core
  style: Australian Pale Ale
  abv: 5.0
  colour: '#4DB848'
  image: ../assets/beers/pale-ale.jpg
  alt: Beerland Pale Ale label
  summary: Bright and balanced.
  notes:
    - An aromatic blend of Galaxy and Cascade hops introduced at different stages of the brewing process, showcases aromas of tropical and citrus fruits balanced by a grassy hop bitterness. It has a light to medium body with a lingering finish that leaves you wanting more.
  specs:
    - { label: IBU, value: '26' }
    - { label: Hops, value: 'Galaxy, Cascade' }

- id: whittys-draught
  name: Whittys Draught
  range: core
  style: Pale Lager
  abv: 4.8
  colour: '#25385F'
  image: ../assets/beers/whittys-draught.jpg
  alt: Whittys Draught label
  summary: Crisp and refreshingly bitter.
  notes:
    - The addition of noble hops to the kettle provides this lager with a crisp and refreshing bitterness. Imported German malts add complexity and a subtle sweetness whilst staying true to the style of a classic lager — perfect for a hot summer's day. Or any other time!
  specs:
    - { label: IBU, value: '24' }
    - { label: Hops, value: 'Wakatu, Saaz' }

- id: easy-tiger
  name: Easy Tiger
  range: core
  style: Mid-Strength Summer Ale
  abv: 3.5
  colour: '#F0A32B'
  image: ../assets/beers/easy-tiger.jpg
  alt: Easy Tiger label
  summary: Refreshing and hoppy.
  notes:
    - Straight off the bat with Australian pale, wheat and cara malts for that full beery taste and mouthfeel we all love. A smattering of Cascade hops in the kettle and an El Dorado dry hop present a familiar refreshing bitterness, while only tasting a little bit like flowers.
  specs:
    - { label: IBU, value: '23' }
    - { label: Hops, value: 'Cascade, El Dorado' }

- id: james-st-juice
  name: James St Juice
  range: core
  style: New England Pale Ale
  abv: 4.8
  colour: '#FFD93B'
  image: ../assets/beers/james-st-juice.jpg
  alt: James St Juice label
  summary: A thick golden haze with pineapple, passionfruit, orange and mango on the nose.
  notes:
    - Our New England inspired pale ale has all the hallmarks of a tropical fruit juice, pouring a thick golden haze with pineapple, passionfruit, orange and mango on the nose.
    - A silky mouthfeel from oats and torrified wheat lend to a surprisingly dry finish, with just enough bitterness to let you know it's still beer.
  specs:
    - { label: IBU, value: '17' }
    - { label: Hops, value: 'Citra, Galaxy, Mosaic' }

- id: india-pale-ale
  name: India Pale Ale
  range: core
  style: American-Style IPA
  abv: 6.0
  colour: '#B23A8C'
  image: ../assets/beers/india-pale-ale.jpg
  alt: Beerland India Pale Ale label
  summary: Aromatic and hoppy.
  notes:
    - This golden-hued IPA channels the soul of the US West Coast. Large additions of Centennial, Sequoia and Mosaic hops provide bold notes of citrus, tropical fruit and fresh pine resin. A firm, lingering bitterness ties everything together in a highly balanced package.
  specs:
    - { label: IBU, value: '55' }
    - { label: Hops, value: 'Centennial, Mosaic, Sequoia' }
