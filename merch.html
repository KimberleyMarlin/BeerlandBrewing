<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Beerland Brewing — Merch</title>
<script>try{if(!localStorage.getItem('bl_age')&&!sessionStorage.getItem('bl_age')){location.replace('index.html')}}catch(e){}</script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&amp;family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@400;500;600&amp;family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0;background:#17130F}
a{color:#F1E6D0;text-decoration:none}a:hover{color:#D99A3E}
.grain{background-color:#17130F;background-image:url("assets/daf2435bb63e0683550d26f14d0f41dd.png");background-size:480px 480px}
.vid{background-color:#2A2119;background-image:repeating-linear-gradient(135deg, rgba(241,230,208,.045) 0 14px, transparent 14px 28px)}
:focus-visible{outline:3px solid #D99A3E;outline-offset:3px}
.btn-solid:hover{background:#F1E6D0 !important;color:#17130F !important}
.btn-line:hover{border-color:#F1E6D0 !important;color:#F1E6D0 !important}
input::placeholder{color:#8F826D}
.card:hover{border-color:#D99A3E !important}
.card:hover .card-cta{color:#D99A3E}
</style>

</head>
<body>
<div id="app"></div>
<template id="dc-template">
<div class="grain" style="font-family: 'Barlow', system-ui, sans-serif; color: #F1E6D0; min-height: 900px">

  <nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 32px; padding: 20px clamp(16px, 4vw, 56px); border-bottom: 1px solid rgba(241, 230, 208, .15)">
    <a href="home.html" style="display: flex; align-items: center; padding: 4px 0">
      <img src="assets/6f21b57650c7a9529a6a3dec3bba04b6.svg" alt="Beerland Brewing" style="display: block; width: 116px; height: auto">
    </a>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 28px; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 2px; text-transform: uppercase">
      <a href="our-beers.html" style="padding: 12px 0">Our Beers</a>
      <a href="where-to-buy.html" style="padding: 12px 0">Where to Buy</a>
      <a href="merch.html" aria-current="page" style="padding: 12px 0; color: {{accent}}; border-bottom: 2px solid {{accent}}">Merch</a>
      <a href="#" aria-label="{{ cartLabel }}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 4px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 7h12l-1 13H7z"></path><path d="M9 7a3 3 0 0 1 6 0"></path></svg>
        <span style="min-width: 24px; height: 24px; padding: 0 6px; box-sizing: border-box; border-radius: 12px; background: {{accent}}; color: #17130F; font-size: 14px; display: inline-flex; align-items: center; justify-content: center">{{ cartCount }}</span>
      </a>
      <a href="#signup" class="btn-line" style="padding: 10px 18px; border: 2px solid {{accent}}; color: {{accent}}">Join the list</a>
    </div>
  </nav>

  <header style="padding: 96px clamp(16px, 4vw, 56px) 56px; max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 28px 48px">
    <div style="display: flex; flex-direction: column; gap: 16px; flex: 1 1 520px">
      <div style="font-family: 'Archivo', 'Barlow', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 16px; letter-spacing: 3px; text-transform: uppercase; color: {{accent}}; line-height: 1.2">Rep the brand</div>
      <h1 style="margin: 0; font-family: 'Alfa Slab One', Georgia, serif; font-weight: 400; font-size: clamp(56px, 8vw, 112px); line-height: .95; text-transform: uppercase">Merch</h1>
      <p style="margin: 0; font-size: 20px; line-height: 1.5; color: #CDBFA6; max-width: 560px">Tees, jumpers, hats and a cooler bag to keep your tinnies cold.</p>
    </div>
    <div role="group" aria-label="Filter by category" style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{ chips }}" as="c" hint-placeholder-count="4">
        <button type="button" onClick="{{ c.pick }}" aria-pressed="{{ c.pressed }}" style="{{ c.style }}">{{ c.label }}</button>
      </sc-for>
    </div>
  </header>

  <section aria-label="Products" style="padding: 0 clamp(16px, 4vw, 56px) 112px; max-width: 1280px; margin: 0 auto">
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 24px">
      <sc-for list="{{ products }}" as="p" hint-placeholder-count="8">
        <button type="button" onClick="{{ p.open }}" aria-label="{{ p.openLabel }}" class="card" style="padding: 0; margin: 0; text-align: left; font: inherit; color: #F1E6D0; background: #221C16; border: 1px solid rgba(241, 230, 208, .12); cursor: pointer; display: flex; flex-direction: column">
          <span style="position: relative; display: block; width: 100%; aspect-ratio: 1; background: #FFFFFF">
            <img src="{{ p.img }}" alt="" style="display: block; width: 100%; height: 100%; object-fit: contain">
            <span style="position: absolute; top: 14px; left: 14px; padding: 6px 12px; background: #17130F; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: {{accent}}">{{ p.cat }}</span>
            <sc-if value="{{ p.inCart }}" hint-placeholder-val="{{ false }}">
              <span style="position: absolute; top: 14px; right: 14px; padding: 6px 12px; background: {{accent}}; color: #17130F; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 2px; text-transform: uppercase">In cart</span>
            </sc-if>
          </span>
          <span style="padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 6px; width: 100%; box-sizing: border-box">
            <span style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
              <span style="font-family: 'Alfa Slab One', Georgia, serif; font-size: 20px; line-height: 1.15; text-transform: uppercase">{{ p.name }}</span>
              <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: 1px; color: {{accent}}; white-space: nowrap">{{ p.price }}</span>
            </span>
            <span style="font-size: 15px; color: #CDBFA6">{{ p.colour }}</span>
            <span class="card-cta" style="margin-top: 8px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 2px; text-transform: uppercase">View details →</span>
          </span>
        </button>
      </sc-for>
    </div>
  </section>

  <section id="signup" style="padding: 72px clamp(16px, 4vw, 56px); background: #221C16; border-top: 1px solid rgba(241, 230, 208, .1)">
    <div style="max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px 48px">
      <div style="flex: 1 1 360px; display: flex; flex-direction: column; gap: 6px">
        <h2 style="margin: 0; font-family: 'Alfa Slab One', Georgia, serif; font-weight: 400; font-size: 32px; text-transform: uppercase">Hear about restocks first</h2>
        <p style="margin: 0; font-size: 16px; color: #CDBFA6">Join the Beerland mailing list. 18+ only. No spam.</p>
      </div>
      <sc-if value="{{ notJoined }}" hint-placeholder-val="{{ true }}">
        <form onSubmit="{{ join }}" style="flex: 1 1 420px; display: flex; flex-wrap: wrap; gap: 10px">
          <label style="flex: 1 1 240px; display: flex">
            <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Email address</span>
            <input type="email" required="required" autocomplete="email" placeholder="Your email" style="flex: 1; min-height: 54px; padding: 0 18px; background: #17130F; border: 2px solid rgba(241, 230, 208, .3); color: #F1E6D0; font-family: 'Barlow', sans-serif; font-size: 17px; box-sizing: border-box">
          </label>
          <button type="submit" class="btn-solid" style="min-height: 54px; padding: 0 30px; background: {{accent}}; color: #17130F; border: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer">Join</button>
        </form>
      </sc-if>
      <sc-if value="{{ joined }}" hint-placeholder-val="{{ false }}">
        <div role="status" style="flex: 1 1 420px; font-family: 'Alfa Slab One', Georgia, serif; font-size: 24px; text-transform: uppercase; color: {{accent}}">You're on the list. Cheers!</div>
      </sc-if>
    </div>
  </section>

  <footer style="padding: 56px clamp(16px, 4vw, 56px) 40px; border-top: 4px solid {{accent}}">
    <div style="max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px">
      <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px 40px">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px">
          <img src="assets/ba7dee7fce34d01e26c07af851e3b856.svg" alt="Beerland Brewing" style="display: block; width: 100px; height: auto">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: {{accent}}">Brewed at Whitfords Brewing Co.</span>
        </div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 24px; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 2px; text-transform: uppercase">
          <a href="our-beers.html" style="padding: 10px 0">Our Beers</a>
          <a href="where-to-buy.html" style="padding: 10px 0">Where to Buy</a>
          <a href="merch.html" style="padding: 10px 0">Merch</a>
          <a href="#" aria-label="Beerland Brewing on Instagram" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1"></circle></svg></a>
          <a href="#" aria-label="Beerland Brewing on Facebook" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 3h-2.5A3.5 3.5 0 0 0 9 6.5V10H6v4h3v7h4v-7h3l1-4h-4V7a1 1 0 0 1 1-1h2z"></path></svg></a>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 14px; padding-top: 24px; border-top: 1px solid rgba(241, 230, 208, .15); font-size: 13px; line-height: 1.6; color: #A99A80">
        <p style="margin: 0"><strong style="color: #CDBFA6">WARNING:</strong> Under the Liquor Control Act 1988, it is an offence: to sell or supply liquor to a person under the age of 18 years on licensed or regulated premises; or for a person under the age of 18 years to purchase, or attempt to purchase, liquor on licensed or regulated premises. Liquor licence [LICENCE NO.] · ABN [ABN]</p>
        <p style="margin: 0">We acknowledge the Whadjuk Noongar people, Traditional Custodians of the land on which we brew, and pay our respects to Elders past and present.</p>
        <span>© 2026 Beerland Brewing · Enjoy responsibly.</span>
      </div>
    </div>
  </footer>

  <sc-if value="{{ hasOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ backdrop }}" style="position: fixed; inset: 0; z-index: 50; background: rgba(10, 8, 6, .85); display: flex; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box; overflow-y: auto">
      <div role="dialog" aria-modal="true" aria-label="{{ sel.name }}" style="position: relative; width: 100%; max-width: 980px; margin: auto; background: #17130F; border: 2px solid {{accent}}; display: flex; flex-wrap: wrap">
        <button type="button" onClick="{{ close }}" aria-label="Close" style="position: absolute; top: 10px; right: 10px; z-index: 2; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #17130F; color: #F1E6D0; border: 1px solid rgba(241, 230, 208, .3); cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
        </button>
        <div style="flex: 1 1 420px; background: #FFFFFF; display: flex; flex-direction: column">
          <div style="position: relative">
            <img src="{{ sel.mainImg }}" alt="{{ sel.mainAlt }}" style="display: block; width: 100%; aspect-ratio: 1; object-fit: contain">
            <sc-if value="{{ sel.hasArrows }}" hint-placeholder-val="{{ false }}">
              <button type="button" onClick="{{ sel.prevView }}" aria-label="Previous option" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: #17130F; color: #F1E6D0; border: 0; border-radius: 50%; cursor: pointer">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><polyline points="15 5 8 12 15 19"></polyline></svg>
              </button>
              <button type="button" onClick="{{ sel.nextView }}" aria-label="Next option" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: #17130F; color: #F1E6D0; border: 0; border-radius: 50%; cursor: pointer">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><polyline points="9 5 16 12 9 19"></polyline></svg>
              </button>
              <span style="position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); padding: 4px 12px; background: #17130F; color: #F1E6D0; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 2px">{{ sel.viewCounter }}</span>
            </sc-if>
          </div>
          <sc-if value="{{ sel.hasViews }}" hint-placeholder-val="{{ false }}">
            <div role="group" aria-label="Product options" style="display: flex; gap: 8px; padding: 0 16px 16px; overflow-x: auto">
              <sc-for list="{{ sel.views }}" as="v" hint-placeholder-count="2">
                <button type="button" onClick="{{ v.pick }}" aria-label="{{ v.label }}" aria-pressed="{{ v.pressed }}" style="{{ v.style }}">
                  <img src="{{ v.src }}" alt="" style="display: block; width: 72px; height: 72px; object-fit: contain; flex: 0 0 auto">
                </button>
              </sc-for>
            </div>
          </sc-if>
        </div>
        <div style="flex: 1 1 340px; padding: 56px clamp(24px, 4vw, 40px) 36px; display: flex; flex-direction: column; gap: 14px">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; color: {{accent}}">{{ sel.cat }}</span>
          <h2 style="margin: 0; font-family: 'Alfa Slab One', Georgia, serif; font-weight: 400; font-size: clamp(30px, 3.5vw, 40px); line-height: 1.05; text-transform: uppercase">{{ sel.name }}</h2>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 1px; color: {{accent}}">{{ sel.price }}</span>
          <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #CDBFA6">{{ sel.colourLine }}<br>{{ sel.detail }}</p>
          <sc-if value="{{ sel.hasSizes }}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-direction: column; gap: 8px">
              <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; color: #CDBFA6">Size</span>
              <div role="group" aria-label="Size" style="display: flex; flex-wrap: wrap; gap: 8px">
                <sc-for list="{{ sel.sizes }}" as="z" hint-placeholder-count="5">
                  <button type="button" onClick="{{ z.pick }}" aria-pressed="{{ z.pressed }}" style="{{ z.style }}">{{ z.label }}</button>
                </sc-for>
              </div>
            </div>
          </sc-if>
          <button type="button" onClick="{{ sel.add }}" style="{{ sel.btnStyle }}">{{ sel.btnLabel }}</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</template>
<script type="text/x-dc" id="dc-logic" data-props='{"accent":{"editor":"color","default":"#D99A3E","options":["#D99A3E","#5FA8A0","#C9643F","#E3C25A"]},"$preview":{"width":1440,"height":2300}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const accent = this.props.accent ?? '#D99A3E';
    const filter = st.filter || 'All';
    const cart = st.cart || {};
    const B = 'assets/';
    const SIZES = ['S', 'M', 'L', 'XL', 'XXL'];
    const items = [
      { id: 'tee', price: '$40', cat: 'Apparel', name: 'Periodic Table of Beers Tee', colour: 'Black', detail: 'Badge on the chest, Periodic Table of Beers print across the back.', sizes: SIZES,
        views: [{ label: 'Front', src: B + '2a9e8aa40a10e5be2cb38503b1548cf2.jpg' }, { label: 'Back', src: B + '91c4b96e6f3b5f8e7cfdd70093072f77.jpg' }] },
      { id: 'crew', price: '$70', cat: 'Apparel', name: 'Logo Crew Jumper', colour: 'Black', detail: 'Small badge on the chest, big badge across the back.', sizes: SIZES,
        views: [{ label: 'Front', src: B + 'a5a53e7f9d0188aa75851a0bbee262bd.jpg' }, { label: 'Back', src: B + 'e55f0e8dc1ca046d2acb11798f7524ea.jpg' }] },
      { id: 'jacket', price: '$75', cat: 'Apparel', name: 'Windbreaker', colour: 'Black', detail: 'Hooded half-zip pullover with a front pouch pocket and chest badge.', sizes: SIZES,
        views: [{ label: 'Front', src: B + 'e42a821da725fbd3d9fc7f4ee18317de.jpg' }] },
      { id: 'bucket-rev', price: '$25', cat: 'Headwear', name: 'Reversible Bucket Hat', colour: '5 prints · black or white', options: true,
        detail: 'Wear it plain with the Beerland badge, or flip it inside out for a print based on one of our core range labels. Use the arrows to see every option.', sizes: null,
        views: [
          { label: 'Easy Tiger print · Black', src: B + 'b32722d468972cecc78e41d5b89e056a.jpg' },
          { label: 'Easy Tiger print · White', src: B + 'b099f1c37e88582d54a13a3d09e045f0.jpg' },
          { label: 'Whittys Draught print · Black', src: B + '0a6add40b37501663810cb7c7af85bcf.jpg' },
          { label: 'Whittys Draught print · White', src: B + '423f42b3eb815504c6e019bac59dc032.jpg' },
          { label: 'Pale Ale print · Black', src: B + '5009ad42150b7cf8af71e363d70137d1.jpg' },
          { label: 'Pale Ale print · White', src: B + '8a90b5e13ff487ed6759380e24a69844.jpg' },
          { label: 'IPA print · Black', src: B + 'b330b76eb58fbfdf21cd5a76fea48f0e.jpg' },
          { label: 'IPA print · White', src: B + 'cdd5bd3dca39cb4a679bbe3434040989.jpg' },
          { label: 'James St Juice print · Black', src: B + '54c66b6a214c81c81f88b7743524cd12.jpg' },
          { label: 'James St Juice print · White', src: B + '7c397f78894fd68cc2fa72c1084b9613.jpg' }
        ] },
      { id: 'bucket-black', price: '$30', cat: 'Headwear', name: 'Bucket Hat', colour: 'Black', detail: 'Beerland badge on the front. [Size / fit info]', sizes: null,
        views: [{ label: 'Front', src: B + 'a775c8f5d59016eacdb179d7f9c5e8df.jpg' }] },
      { id: 'bucket-white', price: '$30', cat: 'Headwear', name: 'Bucket Hat', colour: 'White', detail: 'Beerland badge on the front. [Size / fit info]', sizes: null,
        views: [{ label: 'Front', src: B + 'daa98200fddb35eb2cd3923705efac63.jpg' }] },
      { id: 'cap-washed', price: '$30', cat: 'Headwear', name: 'Enzyme Washed Cap', colour: 'Washed Charcoal', detail: 'Six-panel cap with the Beerland badge. [Size / fit info]', sizes: null,
        views: [{ label: 'Front', src: B + 'f5c5139ac012e65f97ad2a027e94256a.jpg' }] },
      { id: 'cap-cord', price: '[PRICE]', cat: 'Headwear', name: 'Corduroy Cap', colour: 'Black', detail: 'Corduroy cap with the Beerland badge. [Size / fit info]', sizes: null,
        views: [{ label: 'Front', src: B + 'cd5405b699bc1e09d60db7d25cf9e876.jpg' }] },
      { id: 'cooler', price: '$50', cat: 'Accessories', name: 'Cooler Bag', colour: 'Black', detail: 'Insulated carry bag with a shoulder strap and built-in bottle opener.', sizes: null,
        views: [{ label: 'Front', src: B + '5b0f1ac9885508a85bdd2b3b8a4d5fbf.jpg' }] }
    ];
    const base = "min-height: 44px; padding: 0 18px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; ";
    const chips = ['All', 'Apparel', 'Headwear', 'Accessories'].map((label) => {
      const on = label === filter;
      return {
        label: label,
        pressed: on ? 'true' : 'false',
        style: base + (on
          ? 'background: ' + accent + '; color: #17130F; border: 2px solid ' + accent + ';'
          : 'background: transparent; color: #F1E6D0; border: 2px solid rgba(241, 230, 208, .3);'),
        pick: () => this.setState({ filter: label })
      };
    });
    const products = items
      .filter((p) => filter === 'All' || p.cat === filter)
      .map((p) => ({
        name: p.name,
        price: p.price,
        cat: p.cat,
        colour: p.colour,
        img: p.views[0].src,
        inCart: !!cart[p.id],
        openLabel: 'View ' + p.name + ', ' + p.colour,
        open: () => this.setState({ open: p.id, view: 0 })
      }));

    const found = items.filter((p) => p.id === st.open)[0];
    let sel = null;
    if (found) {
      const view = Math.min(st.view || 0, found.views.length - 1);
      const sizePicked = (st.sizes || {})[found.id] || (found.sizes ? 'M' : '');
      const inCart = !!cart[found.id];
      const btnBase = "margin-top: 10px; min-height: 56px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; ";
      const nV = found.views.length;
      const optLabel = found.views[view].label;
      sel = {
        name: found.name,
        price: found.price,
        cat: found.cat,
        detail: found.detail,
        colourLine: found.options ? 'Option: ' + optLabel + ' outer' : 'Colour: ' + found.colour,
        mainImg: found.views[view].src,
        mainAlt: found.options ? found.name + ', ' + optLabel + ' outer' : found.name + ' in ' + found.colour.toLowerCase() + ', ' + optLabel.toLowerCase() + ' view',
        hasViews: nV > 1,
        hasArrows: nV > 2,
        viewCounter: (view + 1) + ' / ' + nV,
        prevView: () => this.setState({ view: (view - 1 + nV) % nV }),
        nextView: () => this.setState({ view: (view + 1) % nV }),
        views: found.views.map((v, i) => ({
          src: v.src,
          label: found.options ? v.label : v.label + ' view',
          pressed: i === view ? 'true' : 'false',
          style: 'flex: 0 0 auto; padding: 0; background: #FFFFFF; cursor: pointer; border: 2px solid ' + (i === view ? accent : 'rgba(23, 19, 15, .15)') + ';',
          pick: () => this.setState({ view: i })
        })),
        hasSizes: !!found.sizes,
        sizes: (found.sizes || []).map((z) => {
          const on = z === sizePicked;
          return {
            label: z,
            pressed: on ? 'true' : 'false',
            style: base + 'min-width: 52px; padding: 0 12px; ' + (on
              ? 'background: #F1E6D0; color: #17130F; border: 2px solid #F1E6D0;'
              : 'background: transparent; color: #F1E6D0; border: 2px solid rgba(241, 230, 208, .3);'),
            pick: () => this.setState({ sizes: Object.assign({}, st.sizes || {}, { [found.id]: z }) })
          };
        }),
        btnLabel: inCart ? 'In your cart — remove' : 'Add to cart',
        btnStyle: btnBase + (inCart
          ? 'background: transparent; color: ' + accent + '; border: 2px solid ' + accent + ';'
          : 'background: ' + accent + '; color: #17130F; border: 2px solid ' + accent + ';'),
        add: () => {
          const next = Object.assign({}, cart);
          if (next[found.id]) { delete next[found.id]; } else { next[found.id] = found.options ? optLabel : (sizePicked || 'One size'); }
          this.setState({ cart: next });
        }
      };
    }
    const close = () => this.setState({ open: null });

    const count = Object.keys(cart).length;
    const joined = !!st.joined;
    return {
      accent: accent,
      chips: chips,
      products: products,
      hasOpen: !!sel,
      sel: sel || { views: [], sizes: [] },
      close: close,
      backdrop: (e) => { if (e && e.target === e.currentTarget) close(); },
      cartCount: String(count),
      cartLabel: 'Cart, ' + count + (count === 1 ? ' item' : ' items'),
      joined: joined,
      notJoined: !joined,
      join: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ joined: true }); }
    };
  }
}
</script>
<script src="preact.min.js"></script>
<script src="dc-lite.js"></script>
</body>
</html>
